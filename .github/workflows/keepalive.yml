# Mantém o projeto Supabase (plano free) ativo.
#
# O Supabase free pausa o projeto após 7 dias sem nenhuma requisição.
# Este job acessa o site publicado a cada 2 dias; a requisição passa pelo
# proxy.ts (middleware), que chama o Supabase Auth — isso conta como
# atividade e reseta o contador de inatividade.
#
# Observações:
# - Não precisa de secrets.
# - O GitHub desativa workflows agendados após 60 dias sem commits no repo;
#   como o deploy é contínuo (push em main), isso não é um problema na prática.
#   Se ficar inativo, é só reativar o workflow na aba Actions.
# - Dá pra rodar na mão pela aba Actions (botão "Run workflow").

name: keepalive

on:
  schedule:
    # A cada 2 dias, às 12:00 UTC (~09:00 em Brasília).
    - cron: "0 12 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar o site publicado
        run: |
          set -euo pipefail
          URL="https://secretaria-chaves5.vercel.app/login"
          echo "GET $URL"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors --max-time 30 "$URL")
          echo "HTTP $code"
          # 2xx/3xx = ok; qualquer 5xx ou falha de rede derruba o job.
          case "$code" in
            2*|3*) echo "Projeto mantido ativo." ;;
            *) echo "Resposta inesperada ($code)"; exit 1 ;;
          esac
