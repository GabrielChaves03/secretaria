# Configuração de deploy na Netlify para Next.js.
# O plugin oficial (@netlify/plugin-nextjs) é instalado automaticamente pela
# Netlify ao detectar Next.js; a linha [[plugins]] deixa isso explícito.

[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 exige Node >= 20.9. Fixamos numa LTS recente.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
