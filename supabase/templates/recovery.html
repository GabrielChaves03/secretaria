<!doctype html>
<html>
  <body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden; border:1px solid #e4e4e7;">
            <tr>
              <td style="padding:32px 32px 8px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="width:28px; height:28px; background-color:#1DB954; border-radius:6px; color:#0D0D0D; font-weight:bold; font-size:14px; text-align:center; vertical-align:middle;">S</td>
                    <td style="padding-left:8px; font-size:15px; font-weight:600; color:#18181b;">Secretária</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 0 32px;">
                <h1 style="margin:0; font-size:20px; color:#18181b;">Redefinir sua senha</h1>
                <p style="margin:12px 0 0 0; font-size:14px; line-height:1.6; color:#52525b;">
                  Recebemos um pedido para redefinir a senha da sua conta na Secretária.
                  Se foi você, clique no botão abaixo. O link expira em 1 hora.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px;">
                <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
                   style="display:inline-block; background-color:#1DB954; color:#0D0D0D; text-decoration:none; font-weight:600; font-size:14px; padding:12px 20px; border-radius:6px;">
                  Redefinir senha
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px 32px;">
                <p style="margin:0; font-size:13px; line-height:1.6; color:#a1a1aa;">
                  Se você não pediu essa redefinição, pode ignorar este e-mail com segurança —
                  sua senha continua a mesma.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
